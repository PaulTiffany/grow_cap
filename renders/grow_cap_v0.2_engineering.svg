<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><style>.title{font:700 42px Arial;fill:#171717}.sub{font:400 22px Arial;fill:#444}.h{font:700 25px Arial;fill:#171717}.t{font:400 20px Arial;fill:#222}.line{stroke:#222;stroke-width:3;fill:none}.dash{stroke:#666;stroke-width:2;stroke-dasharray:8 8;fill:none}.clean{stroke:#178de0;stroke-width:12;fill:none;stroke-linecap:round}.dirty{stroke:#a86118;stroke-width:12;fill:none;stroke-linecap:round}.nutrient{stroke:#259447;stroke-width:12;fill:none;stroke-linecap:round}.air{stroke:#44a9bd;stroke-width:5;stroke-dasharray:10 8;fill:none}.shell{fill:#30343a;stroke:#111;stroke-width:3}.layer{fill:#d9d9d9;stroke:#333;stroke-width:3}.bio{fill:#6b4226;stroke:#342011;stroke-width:3}.char{fill:#292929;stroke:#111;stroke-width:3}.mesh{fill:#b9b9b9;stroke:#333;stroke-width:3}.root{fill:#d7b071;stroke:#7b5226;stroke-width:3}.white{fill:#fff;stroke:#222;stroke-width:3}</style><marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#178de0"/></marker><marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a86118"/></marker><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#259447"/></marker></defs>
<rect width="1600" height="1000" fill="#faf9f6"/><text x="800" y="60" text-anchor="middle" class="title">grow_cap v0.2 — Gravity-Separated Nutrient Cycling Cap</text><text x="800" y="98" text-anchor="middle" class="sub">Clean bypass + biological treatment stack + metered return to roots</text>
<text x="80" y="155" class="h">A. Functional cutaway</text><g transform="translate(90,185)"><path d="M120 650 Q340 570 560 650 L530 790 Q340 850 150 790 Z" class="root"/><text x="340" y="770" text-anchor="middle" class="h">ROOT ZONE</text><rect x="145" y="70" width="390" height="585" rx="28" class="shell"/><rect x="300" y="15" width="80" height="650" rx="34" class="white"/><path d="M340 15 C325 -35 300 -50 285 -75 M340 15 C360 -30 390 -45 410 -68" stroke="#2b8b3d" stroke-width="14" fill="none"/><ellipse cx="285" cy="-75" rx="38" ry="17" fill="#54ad46" transform="rotate(-22 285 -75)"/><ellipse cx="410" cy="-68" rx="42" ry="18" fill="#54ad46" transform="rotate(18 410 -68)"/><rect x="125" y="45" width="430" height="58" rx="20" class="shell"/><text x="340" y="84" text-anchor="middle" fill="white" font-family="Arial" font-size="20" font-weight="700">TOP LID + SOFT-LINED COLLAR</text><circle cx="185" cy="74" r="14" fill="#178de0" stroke="#fff" stroke-width="3"/><path d="M185 74 L185 560 Q185 610 230 630" class="clean" marker-end="url(#ab)"/><text x="5" y="205" class="h" fill="#178de0">CLEAN WATER</text><text x="5" y="234" class="t">isolated bypass tube</text><circle cx="495" cy="74" r="14" fill="#a86118" stroke="#fff" stroke-width="3"/><path d="M495 74 L495 135" class="dirty" marker-end="url(#ao)"/><text x="575" y="102" class="h" fill="#a86118">DIRTY / ORGANIC INPUT</text><text x="575" y="131" class="t">gravity only; no shared manifold</text><rect x="200" y="125" width="280" height="88" rx="14" class="bio"/><path d="M215 155 Q250 125 285 155 T355 155 T425 155 T465 155" stroke="#c69460" stroke-width="12" fill="none"/><text x="340" y="194" text-anchor="middle" fill="white" font-family="Arial" font-size="20" font-weight="700">MULCH / COARSE PREFILTER</text><rect x="200" y="218" width="280" height="25" class="mesh"/><path d="M205 222 L475 239 M205 239 L475 222" stroke="#666" stroke-width="2"/><text x="580" y="235" class="h">REMOVABLE MESH</text><rect x="200" y="250" width="280" height="170" rx="16" class="bio"/><path d="M220 285 C250 255 280 315 310 280 S370 315 400 280 S450 315 465 285" stroke="#d0634d" stroke-width="12" fill="none"/><circle cx="245" cy="345" r="8" fill="#eee"/><circle cx="285" cy="365" r="7" fill="#eee"/><circle cx="430" cy="350" r="8" fill="#eee"/><text x="340" y="395" text-anchor="middle" fill="white" font-family="Arial" font-size="22" font-weight="700">WORM / MICROBIAL CHAMBER</text><text x="580" y="325" class="h">BIOLOGICAL CORE</text><text x="580" y="354" class="t">worms • microbes • passive litter</text><path d="M455 305 C530 295 520 210 520 150" class="air"/><path d="M435 340 C555 345 560 250 560 190" class="air"/><text x="590" y="178" class="h" fill="#27899d">FILTERED AIR VENT</text><rect x="200" y="430" width="280" height="92" rx="12" class="char"/><circle cx="235" cy="465" r="14" fill="#555"/><circle cx="280" cy="485" r="13" fill="#444"/><circle cx="330" cy="460" r="15" fill="#555"/><circle cx="385" cy="486" r="14" fill="#444"/><circle cx="440" cy="462" r="13" fill="#555"/><text x="340" y="510" text-anchor="middle" fill="white" font-family="Arial" font-size="21" font-weight="700">BIOCHAR BUFFER / POLISHING TRAY</text><path d="M200 535 L480 535 L445 590 L235 590 Z" class="layer"/><circle cx="340" cy="570" r="13" fill="#259447"/><path d="M340 580 L340 665" class="nutrient" marker-end="url(#ag)"/><text x="580" y="575" class="h" fill="#259447">METERED NUTRIENT RETURN</text><text x="580" y="604" class="t">replaceable restrictor / pinch valve</text><rect x="158" y="265" width="24" height="180" rx="8" fill="#cdeaff" stroke="#178de0" stroke-width="3"/><line x1="158" y1="330" x2="182" y2="330" stroke="#178de0" stroke-width="4"/><path d="M158 330 L110 330 L110 390" class="clean" marker-end="url(#ab)"/><text x="0" y="290" class="h">STATUS WINDOW</text><text x="0" y="318" class="t">visible level + overflow</text></g>
<text x="1030" y="155" class="h">B. Printable modular stack</text><g transform="translate(1045,190)"><g><ellipse cx="210" cy="30" rx="170" ry="35" class="shell"/><rect x="40" y="30" width="340" height="45" class="shell"/><ellipse cx="210" cy="75" rx="170" ry="35" class="shell"/><ellipse cx="210" cy="40" rx="55" ry="18" class="white"/><text x="410" y="58" class="h">1. Lid + collar</text></g><line x1="210" y1="115" x2="210" y2="150" class="dash"/><g transform="translate(0,145)"><ellipse cx="210" cy="30" rx="145" ry="32" class="bio"/><rect x="65" y="30" width="290" height="55" class="bio"/><ellipse cx="210" cy="85" rx="145" ry="32" class="bio"/><text x="410" y="62" class="h">2. Mulch tray</text></g><line x1="210" y1="270" x2="210" y2="305" class="dash"/><g transform="translate(0,300)"><ellipse cx="210" cy="30" rx="145" ry="32" class="mesh"/><rect x="65" y="30" width="290" height="150" class="bio"/><ellipse cx="210" cy="180" rx="145" ry="32" class="bio"/><text x="410" y="90" class="h">3. Biocore basket</text><text x="410" y="120" class="t">vented, removable</text></g><line x1="210" y1="520" x2="210" y2="555" class="dash"/><g transform="translate(0,550)"><ellipse cx="210" cy="30" rx="145" ry="32" class="char"/><rect x="65" y="30" width="290" height="70" class="char"/><ellipse cx="210" cy="100" rx="145" ry="32" class="char"/><text x="410" y="70" class="h">4. Biochar tray</text></g><line x1="210" y1="690" x2="210" y2="725" class="dash"/><g transform="translate(0,720)"><ellipse cx="210" cy="30" rx="165" ry="34" class="layer"/><path d="M45 30 L375 30 L335 100 L85 100 Z" class="layer"/><ellipse cx="210" cy="100" rx="125" ry="25" class="layer"/><text x="410" y="70" class="h">5. Collector base</text><text x="410" y="100" class="t">clean bypass + nutrient outlet</text></g></g>
<rect x="70" y="900" width="1460" height="70" rx="14" fill="#ecebe7" stroke="#bbb" stroke-width="2"/><text x="800" y="930" text-anchor="middle" class="h">Invariant: the clean stream never enters the biological stack.</text><text x="800" y="958" text-anchor="middle" class="t">The biological stream is transformed, buffered, visibly overflow-safe, and only then metered to the roots.</text></svg>